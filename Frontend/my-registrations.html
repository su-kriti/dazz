<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAZZ - My Registered Events & Digital Tickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-container {
      max-width: 1100px;
      margin: 40px auto 80px auto;
      padding: 0 24px;
    }
    .ticket-grid {
      display: grid;
      gap: 20px;
      margin-top: 24px;
    }
    .ticket-card {
      background: #ffffff;
      color: #1a163a;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
      display: grid;
      grid-template-columns: 1fr 240px;
      overflow: hidden;
      border: 1px solid #edf0f7;
    }
    .ticket-main {
      padding: 24px 28px;
    }
    .ticket-stub {
      background: #f8f9fd;
      border-left: 2px dashed #dcdfe8;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .ticket-code-pill {
      background: #4b36d6;
      color: #ffffff;
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .status-badge-confirmed {
      background: #e6f9ed;
      color: #15733e;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="home.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-shapes"></i></div>
        <span class="brand-text">DAZZ</span>
      </a>

      <nav class="nav-links">
        <a href="home.html" class="nav-item">Home</a>
        <a href="events.html" class="nav-item">Upcoming Events</a>
        <a href="my-registrations.html" class="nav-item active">My Registrations</a>
      </nav>

      <div class="nav-action" id="navAuthArea">
        <a href="home.html" class="btn-primary-pill">Home</a>
      </div>
    </div>
  </header>

  <main class="dashboard-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 16px;">
      <div>
        <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 6px;">My Digital Passes</h1>
        <p style="color: #c9c4eb; font-size: 14.5px;">Official registrations associated with your student profile.</p>
      </div>
      <div id="studentProfileHeader" style="color: #ffffff; font-size: 13.5px; text-align: right;"></div>
    </div>

    <div id="ticketsList" class="ticket-grid">
      <!-- Injected via my-registrations.js from MySQL API -->
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 DAZZ. All rights reserved.</p>
  </footer>

  <script src="my-registrations.js"></script>
</body>
</html>
